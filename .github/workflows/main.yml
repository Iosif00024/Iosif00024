name: GitHub Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
    
permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: GitHub Stats Enhanced
        uses: hnrobert/github-stats-enhanced@v0.1.2
        with:
          github_user_name: Iosif00024
          github_token: ${{ secrets.PROFILE }}
          mode: all

      - name: Commit and push SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update GitHub stats" || echo "No changes to commit"
          git push
