name: GitHub Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: GitHub Stats Enhanced
        uses: hnrobert/github-stats-enhanced@v0.1.2
        with:
          github_user_name: Iosif00024
          github_token: ${{ secrets.PROFILE }}
          mode: all

      - name: List generated SVG files
        shell: bash
        run: |
          find . -type f -name "*.svg" -print

      - name: Commit generated stats
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add dist/
          git status --short

          git commit -m "Update GitHub stats" || echo "No changes to commit"
          git push origin HEAD:main
