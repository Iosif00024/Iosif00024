name: GitHub Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: GitHub Stats Enhanced
        uses: hnrobert/github-stats-enhanced@v0.1.2
        with:
          github_user_name: Iosif00024
          github_token: ${{ secrets.PROFILE }}
          mode: all

      - name: Clean up unused files
        shell: bash
        run: |
          cd dist
          
          find . -type f ! -name "stats1-*.svg" ! -name "stats2-*.svg" ! -name "contributions-*.svg" ! -name "languages-*.svg" -delete
          
          rm -f *-responsive.svg *-adaptive-responsive.svg
          
          echo "Kept files:"
          ls -la *.svg

      - name: Commit generated stats
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add dist/
          git status --short

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update GitHub stats"
            git push origin HEAD:main
          fi
