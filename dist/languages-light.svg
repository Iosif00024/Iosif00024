<svg width="502" height="86" viewBox="-1 -1 502 86" xmlns="http://www.w3.org/2000/svg">
  <style>
    
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .card{animation:fadeUp .5s cubic-bezier(.33,1,.68,1) both}
    .title{animation:fadeUp .45s .08s cubic-bezier(.33,1,.68,1) both}
    .i0{animation:fadeUp .45s .14s cubic-bezier(.33,1,.68,1) both}
    .i1{animation:fadeUp .45s .24s cubic-bezier(.33,1,.68,1) both}
    .i2{animation:fadeUp .45s .34s cubic-bezier(.33,1,.68,1) both}
    .i3{animation:fadeUp .45s .44s cubic-bezier(.33,1,.68,1) both}
    .i4{animation:fadeUp .45s .54s cubic-bezier(.33,1,.68,1) both}
    .bar{animation:fadeIn .3s .25s ease both}
  </style>
  <rect class="card" width="500" height="84" rx="10" fill="rgba(255,255,255,0.8)" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
  
  <g class="title">
  <text x="250" y="24" fill="#1f2937" font-size="14" font-weight="600"
    text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Most Used Languages</text>
  </g>
  <rect x="28" y="36" width="444" height="8" rx="5" fill="#fae8ff" class="bar"/>
  <clipPath id="bc">
    <rect x="28" y="36" width="0" height="8" rx="5">
      <animate attributeName="width" from="0" to="444" dur="0.7s" begin="0.2s"
        calcMode="spline" keySplines="0.4 0 0.2 1" fill="freeze"/>
    </rect>
  </clipPath>
  <g clip-path="url(#bc)" class="bar"><rect x="28" y="36" width="295" height="8" fill="#3572A5"/><rect x="323" y="36" width="131" height="8" fill="#555555"/><rect x="454" y="36" width="16" height="8" fill="#586069"/><rect x="470" y="36" width="2" height="8" fill="#586069"/></g>
  <g style="animation:fadeUp .4s 0.30s cubic-bezier(.33,1,.68,1) both">
        <rect x="44" y="54" width="100" height="16" rx="6"
          fill="rgba(128,128,128,0.07)" stroke="rgba(128,128,128,0.15)" stroke-width="1"/>
        <circle cx="54" cy="62" r="4" fill="#3572A5"/>
        <text x="64" y="66" fill="#1f2937" font-size="10"
          font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Python</text>
        <text x="138" y="66" fill="#6b7280" font-size="9"
          font-weight="600" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">66.5%</text>
      </g><g style="animation:fadeUp .4s 0.37s cubic-bezier(.33,1,.68,1) both">
        <rect x="152" y="54" width="70" height="16" rx="6"
          fill="rgba(128,128,128,0.07)" stroke="rgba(128,128,128,0.15)" stroke-width="1"/>
        <circle cx="162" cy="62" r="4" fill="#555555"/>
        <text x="172" y="66" fill="#1f2937" font-size="10"
          font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">C</text>
        <text x="216" y="66" fill="#6b7280" font-size="9"
          font-weight="600" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">29.5%</text>
      </g><g style="animation:fadeUp .4s 0.44s cubic-bezier(.33,1,.68,1) both">
        <rect x="230" y="54" width="106" height="16" rx="6"
          fill="rgba(128,128,128,0.07)" stroke="rgba(128,128,128,0.15)" stroke-width="1"/>
        <circle cx="240" cy="62" r="4" fill="#586069"/>
        <text x="250" y="66" fill="#1f2937" font-size="10"
          font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Assembly</text>
        <text x="330" y="66" fill="#6b7280" font-size="9"
          font-weight="600" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">3.7%</text>
      </g><g style="animation:fadeUp .4s 0.51s cubic-bezier(.33,1,.68,1) both">
        <rect x="344" y="54" width="112" height="16" rx="6"
          fill="rgba(128,128,128,0.07)" stroke="rgba(128,128,128,0.15)" stroke-width="1"/>
        <circle cx="354" cy="62" r="4" fill="#586069"/>
        <text x="364" y="66" fill="#1f2937" font-size="10"
          font-weight="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Batchfile</text>
        <text x="450" y="66" fill="#6b7280" font-size="9"
          font-weight="600" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">0.3%</text>
      </g>
  
</svg>